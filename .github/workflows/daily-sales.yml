name: Daily Eclesiar Sales Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

jobs:
  collect-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run UK sales collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ECLESIAR_API_KEY: ${{ secrets.ECLESIAR_API_KEY }}
        run: python daily_sales_collector.py
